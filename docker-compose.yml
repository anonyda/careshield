services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: careshield
      POSTGRES_USER: careshield
      POSTGRES_PASSWORD: careshield
    # Ephemeral by design: data is lost on `docker compose down`. Run `npm run db:setup` again afterwards.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careshield -d careshield']
      interval: 2s
      timeout: 3s
      retries: 15
